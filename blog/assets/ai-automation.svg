<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4facfe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00f2fe;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f093fb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f5576c;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGrad)"/>

  <!-- Grid pattern -->
  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="100" y1="0" x2="100" y2="500"/>
    <line x1="200" y1="0" x2="200" y2="500"/>
    <line x1="300" y1="0" x2="300" y2="500"/>
    <line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="500" y1="0" x2="500" y2="500"/>
    <line x1="600" y1="0" x2="600" y2="500"/>
    <line x1="700" y1="0" x2="700" y2="500"/>
  </g>

  <!-- Central AI Brain -->
  <g transform="translate(400, 250)">
    <!-- Outer glow -->
    <circle r="80" fill="url(#nodeGrad)" opacity="0.2"/>
    <circle r="60" fill="url(#nodeGrad)" opacity="0.4"/>

    <!-- Brain shape -->
    <path d="M-25,-30 C-40,-30 -45,-10 -40,5 C-45,15 -35,30 -20,30 C-10,35 10,35 20,30 C35,30 45,15 40,5 C45,-10 40,-30 25,-30 C15,-40 -15,-40 -25,-30 Z"
          fill="url(#nodeGrad)" stroke="#fff" stroke-width="2"/>

    <!-- Brain details -->
    <path d="M-15,-15 C-5,-20 5,-20 15,-15" stroke="#fff" stroke-width="2" fill="none" opacity="0.7"/>
    <path d="M-20,0 C-10,-5 10,-5 20,0" stroke="#fff" stroke-width="2" fill="none" opacity="0.7"/>
    <path d="M-15,15 C-5,10 5,10 15,15" stroke="#fff" stroke-width="2" fill="none" opacity="0.7"/>
    <line x1="0" y1="-25" x2="0" y2="25" stroke="#fff" stroke-width="1.5" opacity="0.5"/>
  </g>

  <!-- Connection lines -->
  <g stroke="url(#nodeGrad)" stroke-width="2" fill="none" opacity="0.6">
    <!-- To metadata node -->
    <path d="M340,250 Q250,200 180,150"/>
    <!-- To workflow node -->
    <path d="M340,250 Q250,300 180,350"/>
    <!-- To compliance node -->
    <path d="M460,250 Q550,200 620,150"/>
    <!-- To search node -->
    <path d="M460,250 Q550,300 620,350"/>
  </g>

  <!-- Metadata tagging node -->
  <g transform="translate(150, 130)">
    <circle r="45" fill="#1a1a2e" stroke="url(#nodeGrad)" stroke-width="3"/>
    <rect x="-20" y="-15" width="40" height="8" rx="2" fill="url(#nodeGrad)"/>
    <rect x="-15" y="-3" width="30" height="6" rx="2" fill="url(#nodeGrad)" opacity="0.7"/>
    <rect x="-20" y="7" width="25" height="6" rx="2" fill="url(#nodeGrad)" opacity="0.5"/>
    <text x="0" y="70" text-anchor="middle" fill="#fff" font-family="Arial" font-size="12" opacity="0.8">Auto Tagging</text>
  </g>

  <!-- Workflow automation node -->
  <g transform="translate(150, 370)">
    <circle r="45" fill="#1a1a2e" stroke="url(#pulseGrad)" stroke-width="3"/>
    <path d="M-15,-10 L0,-10 L0,-20 L20,0 L0,20 L0,10 L-15,10 Z" fill="url(#pulseGrad)"/>
    <text x="0" y="70" text-anchor="middle" fill="#fff" font-family="Arial" font-size="12" opacity="0.8">Workflow</text>
  </g>

  <!-- Compliance node -->
  <g transform="translate(650, 130)">
    <circle r="45" fill="#1a1a2e" stroke="#00f2fe" stroke-width="3"/>
    <path d="M-12,-18 L12,-18 L15,18 L-15,18 Z" fill="none" stroke="#00f2fe" stroke-width="2"/>
    <path d="M-6,0 L-2,6 L8,-8" fill="none" stroke="#00f2fe" stroke-width="3"/>
    <text x="0" y="70" text-anchor="middle" fill="#fff" font-family="Arial" font-size="12" opacity="0.8">Compliance</text>
  </g>

  <!-- Smart search node -->
  <g transform="translate(650, 370)">
    <circle r="45" fill="#1a1a2e" stroke="url(#nodeGrad)" stroke-width="3"/>
    <circle cx="-5" cy="-5" r="15" fill="none" stroke="url(#nodeGrad)" stroke-width="3"/>
    <line x1="6" y1="6" x2="18" y2="18" stroke="url(#nodeGrad)" stroke-width="4" stroke-linecap="round"/>
    <text x="0" y="70" text-anchor="middle" fill="#fff" font-family="Arial" font-size="12" opacity="0.8">Smart Search</text>
  </g>

  <!-- Data flow particles -->
  <g fill="url(#nodeGrad)">
    <circle cx="280" cy="210" r="4" opacity="0.8"/>
    <circle cx="300" cy="225" r="3" opacity="0.6"/>
    <circle cx="260" cy="195" r="3" opacity="0.7"/>
    <circle cx="280" cy="290" r="4" opacity="0.8"/>
    <circle cx="260" cy="305" r="3" opacity="0.6"/>
    <circle cx="520" cy="210" r="4" opacity="0.8"/>
    <circle cx="540" cy="195" r="3" opacity="0.7"/>
    <circle cx="520" cy="290" r="4" opacity="0.8"/>
    <circle cx="540" cy="305" r="3" opacity="0.6"/>
  </g>

  <!-- Stats badges -->
  <g transform="translate(400, 450)">
    <rect x="-150" y="-20" width="90" height="35" rx="5" fill="#1a1a2e" stroke="url(#nodeGrad)" stroke-width="1"/>
    <text x="-105" y="0" text-anchor="middle" fill="#4facfe" font-family="Arial" font-size="14" font-weight="bold">35%</text>
    <text x="-105" y="12" text-anchor="middle" fill="#fff" font-family="Arial" font-size="8" opacity="0.7">Faster</text>

    <rect x="-45" y="-20" width="90" height="35" rx="5" fill="#1a1a2e" stroke="url(#pulseGrad)" stroke-width="1"/>
    <text x="0" y="0" text-anchor="middle" fill="#f5576c" font-family="Arial" font-size="14" font-weight="bold">67%</text>
    <text x="0" y="12" text-anchor="middle" fill="#fff" font-family="Arial" font-size="8" opacity="0.7">Compliance</text>

    <rect x="60" y="-20" width="90" height="35" rx="5" fill="#1a1a2e" stroke="#00f2fe" stroke-width="1"/>
    <text x="105" y="0" text-anchor="middle" fill="#00f2fe" font-family="Arial" font-size="14" font-weight="bold">8:1</text>
    <text x="105" y="12" text-anchor="middle" fill="#fff" font-family="Arial" font-size="8" opacity="0.7">ROI</text>
  </g>

  <!-- Title -->
  <text x="400" y="45" text-anchor="middle" fill="#fff" font-family="Arial" font-size="22" font-weight="bold">AI-Powered Asset Management</text>
</svg>