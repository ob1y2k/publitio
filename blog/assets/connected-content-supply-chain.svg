<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg3Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#141e30;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#243b55;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="damGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b6b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#feca57;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="flowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#54a0ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5f27cd;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00b894;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00cec9;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg3Grad)"/>

  <!-- Background pattern -->
  <g stroke="#fff" stroke-opacity="0.03" stroke-width="1">
    <circle cx="400" cy="250" r="50"/>
    <circle cx="400" cy="250" r="100"/>
    <circle cx="400" cy="250" r="150"/>
    <circle cx="400" cy="250" r="200"/>
    <circle cx="400" cy="250" r="250"/>
  </g>

  <!-- Central DAM Hub -->
  <g transform="translate(400, 250)">
    <!-- Outer glow rings -->
    <circle r="70" fill="url(#damGrad)" opacity="0.1"/>
    <circle r="55" fill="url(#damGrad)" opacity="0.2"/>

    <!-- Main hub -->
    <circle r="45" fill="#1a1a2e" stroke="url(#damGrad)" stroke-width="3"/>

    <!-- DAM icon (folder with star) -->
    <path d="M-20,-15 L-20,20 L20,20 L20,-5 L5,-5 L0,-15 Z" fill="url(#damGrad)" opacity="0.3" stroke="url(#damGrad)" stroke-width="1.5"/>
    <polygon points="0,-5 2,1 8,1 3,5 5,11 0,7 -5,11 -3,5 -8,1 -2,1" fill="#feca57"/>

    <text y="65" text-anchor="middle" fill="#fff" font-family="Arial" font-size="14" font-weight="bold">DAM</text>
    <text y="80" text-anchor="middle" fill="#feca57" font-family="Arial" font-size="10">Central Hub</text>
  </g>

  <!-- Connection lines with flow animation effect -->
  <!-- CMS -->
  <path d="M355,220 Q280,150 200,120" stroke="url(#flowGrad)" stroke-width="3" fill="none" opacity="0.6"/>
  <!-- Creative Tools -->
  <path d="M355,280 Q280,350 200,380" stroke="url(#greenGrad)" stroke-width="3" fill="none" opacity="0.6"/>
  <!-- E-commerce -->
  <path d="M445,220 Q520,150 600,120" stroke="url(#flowGrad)" stroke-width="3" fill="none" opacity="0.6"/>
  <!-- Social Media -->
  <path d="M445,280 Q520,350 600,380" stroke="#54a0ff" stroke-width="3" fill="none" opacity="0.6"/>
  <!-- Marketing Automation - top -->
  <path d="M400,205 Q400,120 400,80" stroke="url(#damGrad)" stroke-width="3" fill="none" opacity="0.6"/>
  <!-- PIM - bottom -->
  <path d="M400,295 Q400,380 400,420" stroke="url(#greenGrad)" stroke-width="3" fill="none" opacity="0.6"/>

  <!-- CMS Node -->
  <g transform="translate(170, 100)">
    <circle r="40" fill="#1a1a2e" stroke="url(#flowGrad)" stroke-width="2"/>
    <!-- Browser icon -->
    <rect x="-18" y="-15" width="36" height="28" rx="3" fill="none" stroke="url(#flowGrad)" stroke-width="2"/>
    <line x1="-18" y1="-5" x2="18" y2="-5" stroke="url(#flowGrad)" stroke-width="1.5"/>
    <circle cx="-12" cy="-10" r="2" fill="url(#flowGrad)"/>
    <circle cx="-6" cy="-10" r="2" fill="url(#flowGrad)"/>
    <text y="55" text-anchor="middle" fill="#fff" font-family="Arial" font-size="11" font-weight="bold">CMS</text>
  </g>

  <!-- Creative Tools Node -->
  <g transform="translate(170, 400)">
    <circle r="40" fill="#1a1a2e" stroke="url(#greenGrad)" stroke-width="2"/>
    <!-- Pen tool icon -->
    <path d="M-5,-15 L10,10 L5,15 L-10,-5 Z" fill="url(#greenGrad)"/>
    <circle cx="-10" cy="-5" r="4" fill="none" stroke="url(#greenGrad)" stroke-width="2"/>
    <text y="55" text-anchor="middle" fill="#fff" font-family="Arial" font-size="11" font-weight="bold">Creative Tools</text>
  </g>

  <!-- E-commerce Node -->
  <g transform="translate(630, 100)">
    <circle r="40" fill="#1a1a2e" stroke="url(#flowGrad)" stroke-width="2"/>
    <!-- Shopping cart icon -->
    <path d="M-15,5 L-10,-10 L15,-10 L12,5 Z" fill="none" stroke="url(#flowGrad)" stroke-width="2"/>
    <circle cx="-8" cy="12" r="3" fill="url(#flowGrad)"/>
    <circle cx="8" cy="12" r="3" fill="url(#flowGrad)"/>
    <text y="55" text-anchor="middle" fill="#fff" font-family="Arial" font-size="11" font-weight="bold">E-commerce</text>
  </g>

  <!-- Social Media Node -->
  <g transform="translate(630, 400)">
    <circle r="40" fill="#1a1a2e" stroke="#54a0ff" stroke-width="2"/>
    <!-- Share icon -->
    <circle cx="0" cy="-8" r="5" fill="#54a0ff"/>
    <circle cx="-10" cy="8" r="5" fill="#54a0ff"/>
    <circle cx="10" cy="8" r="5" fill="#54a0ff"/>
    <line x1="0" y1="-3" x2="-7" y2="5" stroke="#54a0ff" stroke-width="2"/>
    <line x1="0" y1="-3" x2="7" y2="5" stroke="#54a0ff" stroke-width="2"/>
    <text y="55" text-anchor="middle" fill="#fff" font-family="Arial" font-size="11" font-weight="bold">Social Media</text>
  </g>

  <!-- Marketing Automation Node (top) -->
  <g transform="translate(400, 60)">
    <circle r="35" fill="#1a1a2e" stroke="url(#damGrad)" stroke-width="2"/>
    <!-- Automation gear icon -->
    <circle r="8" fill="none" stroke="url(#damGrad)" stroke-width="2"/>
    <g fill="url(#damGrad)">
      <rect x="-2" y="-16" width="4" height="6" rx="1"/>
      <rect x="-2" y="10" width="4" height="6" rx="1"/>
      <rect x="-16" y="-2" width="6" height="4" rx="1"/>
      <rect x="10" y="-2" width="6" height="4" rx="1"/>
    </g>
    <text y="50" text-anchor="middle" fill="#fff" font-family="Arial" font-size="10" font-weight="bold">Marketing</text>
  </g>

  <!-- PIM Node (bottom) -->
  <g transform="translate(400, 440)">
    <circle r="35" fill="#1a1a2e" stroke="url(#greenGrad)" stroke-width="2"/>
    <!-- Database icon -->
    <ellipse cx="0" cy="-8" rx="12" ry="5" fill="none" stroke="url(#greenGrad)" stroke-width="2"/>
    <path d="M-12,-8 L-12,8 C-12,12 12,12 12,8 L12,-8" fill="none" stroke="url(#greenGrad)" stroke-width="2"/>
    <ellipse cx="0" cy="0" rx="12" ry="3" fill="none" stroke="url(#greenGrad)" stroke-width="1" opacity="0.5"/>
    <text y="50" text-anchor="middle" fill="#fff" font-family="Arial" font-size="10" font-weight="bold">PIM</text>
  </g>

  <!-- Flow particles -->
  <g fill="#fff">
    <circle cx="280" cy="170" r="3" opacity="0.6"/>
    <circle cx="300" cy="185" r="2" opacity="0.4"/>
    <circle cx="520" cy="170" r="3" opacity="0.6"/>
    <circle cx="500" cy="185" r="2" opacity="0.4"/>
    <circle cx="280" cy="330" r="3" opacity="0.6"/>
    <circle cx="520" cy="330" r="3" opacity="0.6"/>
    <circle cx="400" cy="140" r="3" opacity="0.6"/>
    <circle cx="400" cy="360" r="3" opacity="0.6"/>
  </g>

  <!-- Stats bar -->
  <g transform="translate(400, 485)">
    <rect x="-200" y="-12" width="180" height="24" rx="4" fill="#1a1a2e" stroke="url(#greenGrad)" stroke-width="1"/>
    <text x="-110" y="4" text-anchor="middle" fill="#00cec9" font-family="Arial" font-size="11" font-weight="bold">60% faster asset discovery</text>

    <rect x="20" y="-12" width="180" height="24" rx="4" fill="#1a1a2e" stroke="url(#damGrad)" stroke-width="1"/>
    <text x="110" y="4" text-anchor="middle" fill="#feca57" font-family="Arial" font-size="11" font-weight="bold">40% faster publishing</text>
  </g>

  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" fill="#fff" font-family="Arial" font-size="20" font-weight="bold">Connected Content Supply Chain</text>
</svg>