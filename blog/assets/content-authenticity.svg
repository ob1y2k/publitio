<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg2Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0c29;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#302b63;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#24243e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#11998e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#38ef7d;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="chainGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg2Grad)"/>

  <!-- Blockchain chain visualization -->
  <g transform="translate(0, 250)">
    <!-- Chain line -->
    <line x1="50" y1="0" x2="750" y2="0" stroke="url(#chainGrad)" stroke-width="4" stroke-dasharray="20,10" opacity="0.3"/>

    <!-- Block 1: Creation -->
    <g transform="translate(130, 0)">
      <rect x="-50" y="-60" width="100" height="80" rx="8" fill="#1a1a2e" stroke="url(#shieldGrad)" stroke-width="2"/>
      <circle cy="-80" r="25" fill="url(#shieldGrad)" opacity="0.2"/>
      <circle cy="-80" r="18" fill="#1a1a2e" stroke="url(#shieldGrad)" stroke-width="2"/>
      <!-- Camera icon -->
      <rect x="-10" y="-88" width="20" height="14" rx="2" fill="url(#shieldGrad)"/>
      <circle cy="-81" r="5" fill="#1a1a2e"/>
      <rect x="-5" y="-92" width="6" height="3" rx="1" fill="url(#shieldGrad)"/>

      <text y="-25" text-anchor="middle" fill="#fff" font-family="Arial" font-size="11" font-weight="bold">CREATION</text>
      <text y="-8" text-anchor="middle" fill="#38ef7d" font-family="Arial" font-size="9">Origin Verified</text>
      <text y="8" text-anchor="middle" fill="#fff" font-family="Arial" font-size="8" opacity="0.6">Device: Canon R5</text>
      <text y="55" text-anchor="middle" fill="#fff" font-family="Arial" font-size="10" opacity="0.8">Step 1</text>
    </g>

    <!-- Arrow -->
    <path d="M195,0 L220,0 L215,-5 M220,0 L215,5" stroke="url(#shieldGrad)" stroke-width="2" fill="none"/>

    <!-- Block 2: Edit -->
    <g transform="translate(290, 0)">
      <rect x="-50" y="-60" width="100" height="80" rx="8" fill="#1a1a2e" stroke="url(#chainGrad)" stroke-width="2"/>
      <circle cy="-80" r="25" fill="url(#chainGrad)" opacity="0.2"/>
      <circle cy="-80" r="18" fill="#1a1a2e" stroke="url(#chainGrad)" stroke-width="2"/>
      <!-- Edit icon -->
      <path d="M-8,-86 L5,-73 L2,-70 L-11,-83 Z" fill="url(#chainGrad)"/>
      <path d="M6,-72 L9,-75 L12,-72 L9,-69 Z" fill="url(#chainGrad)"/>

      <text y="-25" text-anchor="middle" fill="#fff" font-family="Arial" font-size="11" font-weight="bold">EDITING</text>
      <text y="-8" text-anchor="middle" fill="#764ba2" font-family="Arial" font-size="9">Changes Logged</text>
      <text y="8" text-anchor="middle" fill="#fff" font-family="Arial" font-size="8" opacity="0.6">Tool: Photoshop</text>
      <text y="55" text-anchor="middle" fill="#fff" font-family="Arial" font-size="10" opacity="0.8">Step 2</text>
    </g>

    <!-- Arrow -->
    <path d="M355,0 L380,0 L375,-5 M380,0 L375,5" stroke="url(#chainGrad)" stroke-width="2" fill="none"/>

    <!-- Block 3: Review -->
    <g transform="translate(450, 0)">
      <rect x="-50" y="-60" width="100" height="80" rx="8" fill="#1a1a2e" stroke="#11998e" stroke-width="2"/>
      <circle cy="-80" r="25" fill="#11998e" opacity="0.2"/>
      <circle cy="-80" r="18" fill="#1a1a2e" stroke="#11998e" stroke-width="2"/>
      <!-- Checkmark icon -->
      <path d="M-8,-80 L-3,-75 L8,-86" fill="none" stroke="#11998e" stroke-width="3" stroke-linecap="round"/>

      <text y="-25" text-anchor="middle" fill="#fff" font-family="Arial" font-size="11" font-weight="bold">APPROVAL</text>
      <text y="-8" text-anchor="middle" fill="#11998e" font-family="Arial" font-size="9">Rights Cleared</text>
      <text y="8" text-anchor="middle" fill="#fff" font-family="Arial" font-size="8" opacity="0.6">By: Legal Team</text>
      <text y="55" text-anchor="middle" fill="#fff" font-family="Arial" font-size="10" opacity="0.8">Step 3</text>
    </g>

    <!-- Arrow -->
    <path d="M515,0 L540,0 L535,-5 M540,0 L535,5" stroke="#11998e" stroke-width="2" fill="none"/>

    <!-- Block 4: Export -->
    <g transform="translate(610, 0)">
      <rect x="-50" y="-60" width="100" height="80" rx="8" fill="#1a1a2e" stroke="url(#shieldGrad)" stroke-width="2"/>
      <circle cy="-80" r="25" fill="url(#shieldGrad)" opacity="0.2"/>
      <circle cy="-80" r="18" fill="#1a1a2e" stroke="url(#shieldGrad)" stroke-width="2"/>
      <!-- Export icon -->
      <rect x="-8" y="-85" width="16" height="12" rx="1" fill="none" stroke="url(#shieldGrad)" stroke-width="2"/>
      <path d="M0,-90 L0,-78 M-4,-86 L0,-90 L4,-86" fill="none" stroke="url(#shieldGrad)" stroke-width="2"/>

      <text y="-25" text-anchor="middle" fill="#fff" font-family="Arial" font-size="11" font-weight="bold">PUBLISH</text>
      <text y="-8" text-anchor="middle" fill="#38ef7d" font-family="Arial" font-size="9">C2PA Signed</text>
      <text y="8" text-anchor="middle" fill="#fff" font-family="Arial" font-size="8" opacity="0.6">Hash: 7f3a...</text>
      <text y="55" text-anchor="middle" fill="#fff" font-family="Arial" font-size="10" opacity="0.8">Step 4</text>
    </g>
  </g>

  <!-- C2PA Badge -->
  <g transform="translate(400, 420)">
    <rect x="-80" y="-25" width="160" height="50" rx="25" fill="#1a1a2e" stroke="url(#shieldGrad)" stroke-width="2"/>
    <!-- Shield icon -->
    <path d="M-50,-8 L-50,5 C-50,15 -40,20 -35,22 C-30,20 -20,15 -20,5 L-20,-8 L-35,-15 Z"
          fill="url(#shieldGrad)" opacity="0.3" stroke="url(#shieldGrad)" stroke-width="1.5"/>
    <path d="M-42,0 L-38,5 L-28,-5" fill="none" stroke="#fff" stroke-width="2"/>
    <text x="15" y="-2" text-anchor="middle" fill="#fff" font-family="Arial" font-size="14" font-weight="bold">C2PA</text>
    <text x="15" y="12" text-anchor="middle" fill="#38ef7d" font-family="Arial" font-size="10">Content Credentials</text>
  </g>

  <!-- Decorative elements -->
  <g fill="#38ef7d" opacity="0.1">
    <circle cx="100" cy="80" r="30"/>
    <circle cx="700" cy="100" r="40"/>
    <circle cx="750" cy="400" r="25"/>
    <circle cx="50" cy="420" r="35"/>
  </g>

  <!-- Title -->
  <text x="400" y="50" text-anchor="middle" fill="#fff" font-family="Arial" font-size="24" font-weight="bold">Content Authenticity &amp; Provenance</text>
  <text x="400" y="75" text-anchor="middle" fill="#38ef7d" font-family="Arial" font-size="14">Verifiable Chain of Custody for Digital Assets</text>
</svg>